version: 2

updates:
  # The site itself has no package manager. The only third-party code in this
  # repo is the GitHub Actions used by the Pages workflow, so that is what gets
  # watched. Add an npm entry here if a build toolchain is introduced later.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
